<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<style>
    body {
        text-align: center;
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
    }

    canvas {
        background: #222;
        display: block;
        margin: 20px auto;
        border: 2px solid white;
    }

    h1 {
        margin-top: 20px;
    }

    #score {
        font-size: 20px;
    }

    button {
        padding: 10px 20px;
        font-size: 16px;
        margin-top: 10px;
        cursor: pointer;
    }
</style>
</head>
<body>

<h1>🐍 Snake Game</h1>
<div id="score">Score: 0</div>
<canvas id="gameCanvas" width="400" height="400"></canvas>
<button onclick="startGame()">Restart</button>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const gridSize = 20;
const tileCount = canvas.width / gridSize;

let snake;
let direction;
let food;
let score;
let gameInterval;

function startGame() {
    snake = [{x: 10, y: 10}];
    direction = {x: 0, y: 0};
    food = spawnFood();
    score = 0;
    document.getElementById("score").innerText = "Score: " + score;

    if (gameInterval) clearInterval(gameInterval);
    gameInterval = setInterval(gameLoop, 100);
}

function spawnFood() {
    return {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
    };
}

function gameLoop() {
    moveSnake();
    if (checkCollision()) {
        alert("Game Over! Final Score: " + score);
        startGame();
        return;
    }
    drawGame();
}

function moveSnake() {
    const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
    };

    snake.unshift(head);

    // Eat food
    if (head.x === food.x && head.y === food.y) {
        score++;
        document.getElementById("score").innerText = "Score: " + score;
        food = spawnFood();
    } else {
        snake.pop();
    }
}

function checkCollision() {
    const head = snake[0];

    // Wall collision
    if (
        head.x < 0 || head.x >= tileCount ||
        head.y < 0 || head.y >= tileCount
    ) return true;

    // Self collision
    for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
            return true;
        }
    }

    return false;
}

function drawGame() {
    ctx.fillStyle = "#222";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw snake
    ctx.fillStyle = "lime";
    snake.forEach(segment => {
        ctx.fillRect(
            segment.x * gridSize,
            segment.y * gridSize,
            gridSize - 2,
            gridSize - 2
        );
    });

    // Draw food
    ctx.fillStyle = "red";
    ctx.fillRect(
        food.x * gridSize,
        food.y * gridSize,
        gridSize - 2,
        gridSize - 2
    );
}

document.addEventListener("keydown", e => {
    switch(e.key) {
        case "ArrowUp":
            if (direction.y !== 1) direction = {x: 0, y: -1};
            break;
        case "ArrowDown":
            if (direction.y !== -1) direction = {x: 0, y: 1};
            break;
        case "ArrowLeft":
            if (direction.x !== 1) direction = {x: -1, y: 0};
            break;
        case "ArrowRight":
            if (direction.x !== -1) direction = {x: 1, y: 0};
            break;
    }
});

// Start game initially
startGame();
</script>

</body>
</html>
